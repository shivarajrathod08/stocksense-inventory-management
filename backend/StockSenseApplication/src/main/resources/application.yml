spring:
  application:
    name: stocksense

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stocksense}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:your_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

stocksense:
  jwt:
    secret: ${JWT_SECRET:stocksense-super-secret-jwt-key-change-in-production-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
