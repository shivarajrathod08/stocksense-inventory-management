# StockSense IMS — Example Application Configuration
# Copy this file to application.yml or set the corresponding environment variables.

spring:
  application:
    name: stocksense

  datasource:
    # PostgreSQL Database URL
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stocksense}
    # Database username
    username: ${DB_USERNAME:postgres}
    # Database password (override with DB_PASSWORD environment variable)
    password: ${DB_PASSWORD:your_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

stocksense:
  jwt:
    # 256-bit (32-byte) hex or base64 secret for HMAC-SHA256 JWT signing
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # Token expiration in milliseconds (default 24 hours)
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
